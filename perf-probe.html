<!doctype html><meta charset="utf-8"><title>Frame scheduler probe</title><style>html,body{margin:0;background:#303030;color:#eee}canvas{display:block;width:540px;height:960px}pre{position:fixed;top:0;left:550px}</style><canvas width="540" height="960"></canvas><pre id="out"></pre><script type="module">
const mode=new URLSearchParams(location.search).get('mode')||'blank',canvas=document.querySelector('canvas');
let draw=()=>{}, app=null;
if(mode.includes('large')){canvas.width=1080;canvas.height=2400;canvas.style.width='430.65px';canvas.style.height='957px';canvas.style.margin='0 auto';}

if(mode.startsWith('2d')){const ctx=canvas.getContext('2d');draw=n=>{ctx.fillStyle=n%2?'#111':'#222';ctx.fillRect(0,0,540,960);};}
if(mode.startsWith('gl')){const gl=canvas.getContext(mode==='gl2'?'webgl2':'webgl');draw=n=>{gl.clearColor(n%2?.2:.1,.3,.4,1);gl.clear(gl.COLOR_BUFFER_BIT);};}
if(mode.startsWith('pixi')){const {Application,Graphics}=await import('/node_modules/.vite/deps/pixi__js.js');app=new Application({width:540,height:1200,resolution:mode.includes('large')?2:1,backgroundColor:0x333333,autoStart:mode.includes('auto'),antialias:mode.includes('aa'),autoDensity:true});canvas.replaceWith(app.view);const n=mode.includes('1000')?1000:1;for(let i=0;i<n;i++)app.stage.addChild(new Graphics().beginFill(0xff8855).drawRect(i%54*10,Math.floor(i/54)*10,8,8).endFill());draw=()=>app.renderer.render(app.stage);}
if(mode.includes('audio')){const files=await(await fetch('/src/data/source-audio.json')).json();window.audio=files.clips.map(c=>{const a=new Audio(c.exports[0].url);a.preload='auto';return a;});}
window.probe={mode,frames:0,timers:0,start:performance.now(),samples:[],visibility:document.visibilityState};
let previous=performance.now();function frame(now){const p=window.probe;p.frames++;p.samples.push(now-previous);previous=now;if(!mode.includes('quiet'))draw(p.frames);requestAnimationFrame(frame);}requestAnimationFrame(frame);setInterval(()=>{probe.timers++;if(!mode.includes('quiet'))document.querySelector('#out').textContent=JSON.stringify({mode,frames:probe.frames,timers:probe.timers,elapsed:performance.now()-probe.start});},16);
</script>
